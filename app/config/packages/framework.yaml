# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Behind a reverse proxy (DDEV's router, Cloudflare, nginx) REMOTE_ADDR is the proxy, so the
    # per-client limit on /mcp (MCP_LIMIT_IP) would be one bucket for everybody. Trust only the hops listed in
    # TRUSTED_PROXIES (default: private networks);
    # add Cloudflare's ranges in production. Never trust X-Forwarded-For from anyone else.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for']  # only the client IP: a forwarded host or proto must not rewrite the request URI

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # A testnet payment costs the caller nothing: POST /mcp is limited per client before any
    # signature check (App\EventListener\McpRateLimit, MCP_LIMIT_IP per client and MCP_LIMIT_GLOBAL for
    # everybody, per minute), and analyze_terms,
    # which spends our Hugging Face credit, per client per hour (TERMS_LIMIT_IP) and for the whole
    # server per day (TERMS_LIMIT_DAY).
    rate_limiter:
        mcp_ip:
            policy: sliding_window
            limit: '%env(int:MCP_LIMIT_IP)%'
            interval: '1 minute'
        mcp_global:
            policy: sliding_window
            limit: '%env(int:MCP_LIMIT_GLOBAL)%'
            interval: '1 minute'
        terms_ip:
            policy: sliding_window
            limit: '%env(int:TERMS_LIMIT_IP)%'
            interval: '1 hour'
        terms_day:
            policy: fixed_window
            limit: '%env(int:TERMS_LIMIT_DAY)%'
            interval: '1 day'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
