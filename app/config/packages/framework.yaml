# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Behind a reverse proxy (DDEV's router, Cloudflare, nginx) REMOTE_ADDR is the proxy, so the
    # per-client limit of analyze_terms would be one bucket for everybody. Trust only the hops listed in
    # TRUSTED_PROXIES (default: private networks, which covers DDEV and a proxy on the same host);
    # add Cloudflare's ranges in production. Never trust X-Forwarded-For from anyone else.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host']

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # analyze_terms spends our Hugging Face credit, and a testnet payment costs the caller nothing:
    # a limit per client and one for the whole server, per day. Env: TERMS_LIMIT_IP (per hour), TERMS_LIMIT_DAY.
    rate_limiter:
        terms_ip:
            policy: sliding_window
            limit: '%env(int:TERMS_LIMIT_IP)%'
            interval: '1 hour'
        terms_day:
            policy: fixed_window
            limit: '%env(int:TERMS_LIMIT_DAY)%'
            interval: '1 day'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
