mcp:
    servers:
        default:
            # Use the MCP SDK attributes to declare tools, prompts and resources on your services.
            # Once MCP services exist, restrict the registry to their namespace(s), e.g. 'App\Mcp\'.
            # Namespace patterns must match at least one registered MCP service.
            # '*' also exposes MCP services from third-party bundles over HTTP.
            registry: 'App\Mcp\'

            http:
                path: /mcp
                # Only localhost is allowed by default. Add hostnames without ports for remote access.
                allowed_hosts: ['localhost', 'quebracho-x402-mcp.ddev.site']

            # Enable STDIO for clients such as Claude Desktop via bin/console mcp:server.
            # transports:
            #     stdio: true

    # The app:ask agent reaches this same server as an MCP client; the
    # PSR-18 client under it pays x402 in band (Quebracho\X402\PayingMcpClient).
    clients:
        buyer:
            servers:
                self:
                    transport: http
                    url: '%env(MCP_URL)%'
                    http_client: 'Quebracho\X402\PayingMcpClient'
                # Ombú's own MCP (search and detail are free; ombu_call_service pays x402 on Arc).
                ombu:
                    transport: http
                    url: '%env(OMBU_MCP_URL)%'
                    http_client: 'Quebracho\X402\PayingMcpClient'
