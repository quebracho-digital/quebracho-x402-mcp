ai:
    platform:
        # Hugging Face Inference Providers: only HF_TOKEN, no local server (bin/console app:ask --hf).
        huggingface:
            api_key: '%env(HF_TOKEN)%'
            api_catalog: true
            # Bounded: a slow model must not outlive the signed payment (60 s) and the buyer's wait.
            http_client: 'app.hf_http_client'
