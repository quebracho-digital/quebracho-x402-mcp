# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # app:x402:check verifies X402_NETWORK has a scheme here. The list is written once (anchor x402_schemes),
    # aliased by X402McpMiddleware below, so the check and the middleware cannot drift apart.
    App\Command\X402CheckCommand:
        arguments:
            $schemes: &x402_schemes ['@Quebracho\X402\EvmExact']

    # The same network check as app:x402:check, at cache:warmup (cache:clear, deploy): a bad X402_NETWORK fails the deploy.
    App\X402\NetworkWarmer:
        arguments:
            $schemes: *x402_schemes

    # Faceted on purpose: only Quebracho's Ombú listings.
    App\Mcp\OmbuSearchTool:
        arguments:
            # Quebracho's own listings: /market?seller[ours]=ours. Not an env var: nothing at runtime changes it.
            $facet: {seller: {ours: ours}}

    # analyze_terms memo (TermsAnalyzer, 7 days): the same text is not sent to the model twice. Redis when X402_REDIS_URL is set,
    # else (or when Redis does not answer) this host's files, with a warning.
    terms.cache:
        class: Symfony\Component\Cache\Adapter\AdapterInterface
        factory: ['App\Terms\TermsCacheFactory', 'create']
        arguments:
            $redisUrl: '%env(default::X402_REDIS_URL)%'
            $dir: '%kernel.project_dir%/var/terms-cache'
            $logger: '@logger'

    # Hugging Face calls (analyze_terms, app:ask --hf): at most 40 s in total, inside X402_DURATIONS for analyze_terms.
    app.hf_http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        arguments: [{timeout: 15, max_duration: 40}]

    Quebracho\X402\EvmExact: ~

    # One claim per payment, durable across processes on this host. Kept for the constructor's $claim; the ledger below claims instead.
    Quebracho\X402\FileClaims:
        arguments: ['%kernel.project_dir%/var/x402-claims']

    # The payment ledger (claimed, settled with its response, pending): Redis when X402_REDIS_URL is set, else this host's
    # files. Set it on every host; with Redis down the request fails, it never falls back to files (LedgerFactory).
    Quebracho\X402\PaymentLedger:
        factory: ['App\X402\LedgerFactory', 'create']
        arguments:
            $redisUrl: '%env(default::X402_REDIS_URL)%'
            $dir: '%kernel.project_dir%/var/x402-ledger'

    # Settlement goes through App\X402\Facilitator: X402_FACILITATOR is
    # "mock" or a facilitator URL, never left implicit.
    Quebracho\X402\X402McpMiddleware:
        arguments:
            $schemes: *x402_schemes
            $price: !closure '@App\X402\Pricing'
            $claim: !closure '@Quebracho\X402\FileClaims'
            $settle: !closure '@App\X402\Facilitator'
            # Replaces $claim and $release for the payment state (see the ledger above).
            $ledger: '@Quebracho\X402\PaymentLedger'
            $verify: !closure ['@App\X402\Facilitator', 'verify']
            # A claim whose payment charged nothing is freed: the buyer may retry.
            $release: !closure ['@Quebracho\X402\FileClaims', 'release']
            # A slow tool (X402_DURATIONS) refuses a signature that would expire before its settle.
            $duration: !closure ['@App\X402\Pricing', 'duration']
            # A paid name that is no registered tool: JSON-RPC -32602 before any payment is read.
            $validate: !closure ['@App\X402\Pricing', 'validate']
            $responses: '@mcp.psr17_factory'
            $streams: '@mcp.psr17_factory'
            # AddressCheck on the payer, answered by App\X402\Screening.
            $events: '@event_dispatcher'
            # A 'pending' payment is settled or freed by the chain (EVM receipt) or the facilitator (paymentId), not left to 409 until its TTL.
            $lookup: !closure ['@App\X402\ReceiptLookup', '__invoke']

    # The 'x402' Monolog channel exists only with symfony/monolog-bundle (optional; config/packages/x402_log.php). '@?' gives NULL without it.
    App\X402\PaymentLog:
        arguments:
            $channel: '@?monolog.logger.x402'

    # The lookup's RPC and facilitator calls; any failure answers NULL (still pending).
    App\X402\ReceiptLookup:
        arguments:
            $http: '@psr18.http_client'
            $requests: '@mcp.psr17_factory'
            $streams: '@mcp.psr17_factory'

    # Frozen in the USDC contract itself (not only OFAC): asked after Screening's
    # lists (lower priority). An RPC that cannot answer follows the same policy
    # as the screening API: X402_SCREENING_UNAVAILABLE, "reject" by default.
    Quebracho\X402\TokenBlacklist:
        factory: ['App\X402\BlacklistFactory', 'create']
        arguments:
            $http: '@psr18.http_client'
            $requests: '@mcp.psr17_factory'
            $streams: '@mcp.psr17_factory'
            $unavailable: '%env(X402_SCREENING_UNAVAILABLE)%'
        tags:
            - { name: kernel.event_listener, event: Quebracho\X402\AddressCheck, priority: -10 }

    mcp.server.default.controller:
        class: App\Controller\McpController
        public: true
        autowire: false
        arguments:
            - '@mcp.server.default'
            - '@mcp.psr_http_factory'
            - '@mcp.http_foundation_factory'
            - '@mcp.psr17_factory'
            - '@mcp.psr17_factory'
            - '@mcp.server.default.middleware_factory'
            - '@Quebracho\X402\X402McpMiddleware'
            - '@logger'
        tags: [controller.service_arguments, { name: monolog.logger, channel: mcp }]

    # Buyer side, for app:ask: pays paid tools in band within X402_BUDGETS and X402_MAX_PER_PAYMENT, only to X402_PAYTO_ALLOW.
    Quebracho\X402\PayingMcpClient:
        arguments:
            # No redirects: a 307 must never carry the signed payment to another host. Waits up to 180 s: more than the longest signature we offer (X402_TIMEOUTS, 120 s for analyze_terms) plus the seller's settle (the library README says so); a buyer that hangs up early can pay for an answer it never reads.
            $client: !service
                class: Symfony\Component\HttpClient\Psr18Client
                arguments:
                    - !service
                        class: Symfony\Contracts\HttpClient\HttpClientInterface
                        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
                        arguments: [{max_redirects: 0, timeout: 30, max_duration: 180}]
            $schemes:
                - !service
                    class: Quebracho\X402\EvmExact
                    arguments: [!service { class: Quebracho\X402\Signer, arguments: ['%env(X402_BUYER_KEY)%'] }]
            $budget: !service
                class: Quebracho\X402\Budget
                factory: ['App\X402\BuyerBudget', 'create']
                # Caps per network and per single payment, in USD, from env (JSON). A network without a cap is never paid.
                # Expired signatures the seller never settled are freed, once the chain says so.
                # X402_BUYER_MAX_TIMEOUT: no signature lives longer than the 180 s the client below waits.
                arguments: ['%env(json:X402_BUDGETS)%', '%env(json:X402_MAX_PER_PAYMENT)%', !closure '@App\X402\AuthorizationState', '%env(X402_BUYER_KEY)%', '%env(int:X402_BUYER_MAX_TIMEOUT)%']
            $streams: '@mcp.psr17_factory'
            $onPaid: !closure '@App\X402\Receipts'
            $onRefused: !closure ['@App\X402\Receipts', 'refused']
            # AddressCheck on payTo before signing, answered by App\X402\Screening.
            $events: '@event_dispatcher'

when@test:
    services:
        # Served by id: the registry (App\Mcp\) matches this id although the class is outside it.
        # app.mcp_tools must list (and Pricing charge) its #[PaidJob] tools (AppKernelTest).
        App\Mcp\AliasedJobs:
            class: App\Tests\X402\JobToolsFixture
            autoconfigure: true
        # A tagged MCP tool outside the registry: not served, so not in app.mcp_tools.
        App\Tests\X402\InvokableJobStartFixture:
            autoconfigure: true
